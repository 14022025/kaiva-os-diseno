<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<meta name="theme-color" content="#080808">
<title>Hola de nuevo · Kaiva OS</title>
<link rel="icon" href="assets/kaiva-k.png" type="image/png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600;700&display=swap">

<style>
.kp {
  --kp-negro: #080808; --kp-morado: #7A3FC9; --kp-morado-hondo: #36115F; --kp-morado-tinta: #6A32B8;
  --kp-tinta: #080808; --kp-tinta-2: #4E4E55; --kp-tinta-3: #6B6B73; --kp-niebla: #F2F2F5; --kp-linea: rgba(8,8,8,.08);
  --kp-ok: #047857; --kp-mal: #b91c1c;
  /* Movimiento (MOTION.md): las mismas curvas que tokens.css, copiadas como
     variables locales porque esta página no carga tokens.css. */
  --kp-ease: cubic-bezier(.16,1,.3,1);          /* = --ease-reveal: llega y se asienta */
  --kp-sale: cubic-bezier(.3,0,.8,.15);         /* = --ease-sale */
  --kp-resorte: cubic-bezier(.16,1,.3,1);       /* = --ease-resorte (respaldo) */
  margin: 0; min-height: 100vh; min-height: 100dvh; display: flex; flex-direction: column; align-items: center;
  background: var(--kp-negro); color: var(--kp-tinta); overflow-x: hidden;
  font: 15px/1.55 'Geist', ui-sans-serif, system-ui, -apple-system, 'Segoe UI', sans-serif; letter-spacing: -.005em;
  -webkit-font-smoothing: antialiased;
}
.kp *, .kp *::before, .kp *::after { box-sizing: border-box; }

/* El escenario: fondo plano, sin degradados ni brillos (pedido del
   2026-10-19, igual que el panel nuevo y la web). Fijo, para que no se corte
   al hacer scroll. */
.kp-fondo { position: fixed; inset: 0; z-index: 0; pointer-events: none; background: none; }

/* La marca va en la esquina, de lado a lado en cualquier pantalla (2026-10-19), no en una caja centrada. */
.kp-top { position: relative; z-index: 1; width: 100%; padding: 24px clamp(16px, 2.4vw, 32px) 0; }
.kp-marca { display: inline-block; color: #fff; text-decoration: none; font-size: 15px; line-height: 1.05; letter-spacing: -.02em; }
.kp-marca b { display: block; font-weight: 700; }
.kp-marca i { font-style: normal; color: #A580D6; }

.kp-centro { position: relative; z-index: 1; flex: 1; width: 100%; display: grid; place-items: center; padding: 32px 16px; }
.kp-tarjeta { width: min(460px, 100%); background: #fff; border-radius: 24px; padding: 32px 30px 28px;
  box-shadow: 0 40px 90px -30px rgba(0,0,0,.7), 0 0 0 1px rgba(255,255,255,.06);
  animation: kp-sube 560ms var(--kp-ease) both; }
@keyframes kp-sube { from { opacity: 0; transform: translateY(14px) scale(.985); } }
@supports (animation-timing-function: linear(0, 1)) {
  .kp { --kp-resorte: linear(0, 0.044, 0.149, 0.283, 0.424, 0.558, 0.677, 0.776, 0.856, 0.917, 0.961, 0.992,
    1.011, 1.022, 1.027, 1.028, 1.027, 1.023, 1.019, 1.015, 1.012, 1.008, 1.006, 1.004, 1); }
}

/* — la conexión — */
.kp-enlace { display: flex; align-items: flex-start; justify-content: center; gap: 4px; margin: 2px 0 26px; }
.kp-app { display: grid; justify-items: center; gap: 8px; width: 76px; }
.kp-app small { font: 500 11px/1 Geist, system-ui, sans-serif; color: var(--kp-tinta-3); letter-spacing: .02em; }
/* Nada aparece de la nada: las dos piezas entran escalonadas (offset & delay),
   primero quien pide, luego Kaiva, y el cable se tiende entre ellas. */
.kp-enlace > * { animation: kp-pieza 520ms var(--kp-ease) both; }
.kp-enlace > :nth-child(1) { animation-delay: 160ms; }
.kp-enlace > :nth-child(2) { animation-delay: 260ms; }
.kp-enlace > :nth-child(3) { animation-delay: 220ms; }
@keyframes kp-pieza { from { opacity: 0; transform: translateY(8px) scale(.94); } }
/* Conectado: anticipación (se inclinan una hacia la otra) y el apretón llega
   con el chulo, con el resorte: el único rebote de toda la pantalla. */
.kp-enlace--ok > :nth-child(1) .kp-tile { animation: kp-hacia-der 620ms var(--kp-resorte) 760ms both; }
.kp-enlace--ok > :nth-child(3) .kp-tile { animation: kp-hacia-izq 620ms var(--kp-resorte) 760ms both; }
@keyframes kp-hacia-der { 40% { transform: translateX(5px) scale(1.03); } }
@keyframes kp-hacia-izq { 40% { transform: translateX(-5px) scale(1.03); } }
/* Error: un "no" de cabeza que se apaga (follow-through), no un temblor fijo. */
.kp-enlace--error .kp-insignia { animation: kp-no 520ms ease-out 700ms both; }
@keyframes kp-no { 15% { transform: translateX(-5px); } 35% { transform: translateX(4px); } 55% { transform: translateX(-2.5px); } 75% { transform: translateX(1px); } }
/* Al pulsar Permitir o Entrar: la respuesta es inmediata aunque la página
   siguiente tarde. El flujo de puntos se acelera, que dice "conectando". */
.kp-enlace--conectando .kp-cable line { animation-duration: .32s; stroke: var(--kp-morado); }
.kp-enlace--conectando .kp-insignia { transform: scale(.9); transition: transform 240ms var(--kp-ease); }
.kp-tile { width: 56px; height: 56px; border-radius: 16px; display: grid; place-items: center; }
.kp-tile svg { width: 26px; height: 26px; }
/* La K es el favicon de verdad (PNG), no una letra en CSS: así sigue a la marca
   si vuelve a cambiar. Radio 13 px = el del PNG a 56 px. */
.kp-tile--kaiva { display: block; border-radius: 13px; box-shadow: 0 10px 24px -10px rgba(54,17,95,.85); }
.kp-tile--claude, .kp-tile--google { background: var(--kp-niebla); color: var(--kp-tinta); box-shadow: inset 0 0 0 1px var(--kp-linea); }
.kp-cable { position: relative; width: 104px; height: 56px; display: grid; place-items: center; }
.kp-cable > svg { position: absolute; left: 0; top: 24px; width: 100%; height: 8px; overflow: visible; }
.kp-cable line { stroke: #CFCFD6; stroke-width: 2; stroke-dasharray: 2 6; stroke-linecap: round; animation: kp-fluye 1.1s linear infinite; }
@keyframes kp-fluye { to { stroke-dashoffset: -16; } }
.kp-insignia { position: relative; width: 30px; height: 30px; border-radius: 50%; display: grid; place-items: center;
  background: #fff; color: var(--kp-tinta-2); box-shadow: inset 0 0 0 1px var(--kp-linea), 0 4px 12px -4px rgba(8,8,8,.18); }
.kp-insignia svg { width: 15px; height: 15px; }
.kp-enlace--ok .kp-cable line { stroke: var(--kp-morado); stroke-dasharray: none; animation: none; }
.kp-enlace--ok .kp-insignia { background: var(--kp-morado); color: #fff; box-shadow: 0 0 0 6px rgba(122,63,201,.14);
  animation: kp-pop 560ms var(--kp-resorte) 560ms both; }
.kp-enlace--ok .kp-insignia svg { stroke-width: 2.6; stroke-dasharray: 24; stroke-dashoffset: 24; animation: kp-traza 320ms var(--kp-ease) 860ms forwards; }
/* Nunca desde scale(0): desde .6, que ya se lee como "algo que aparece". */
@keyframes kp-pop { from { transform: scale(.6); opacity: 0; } }
@keyframes kp-traza { to { stroke-dashoffset: 0; } }
.kp-enlace--error .kp-cable line { stroke: #E3B4B4; animation: none; }
.kp-enlace--error .kp-insignia { background: #FEF2F2; color: var(--kp-mal); box-shadow: inset 0 0 0 1px rgba(185,28,28,.18); }
.kp-enlace--error .kp-insignia svg { stroke-width: 2.6; }

/* — texto — */
.kp-ante { margin: 0 0 10px; font: 500 11px/1 Geist, system-ui, sans-serif; letter-spacing: .08em; text-transform: uppercase; color: var(--kp-morado-tinta); }
.kp-ante--ok { color: var(--kp-ok); }
.kp-ante--error { color: var(--kp-mal); }
.kp-tarjeta h1 { margin: 0 0 10px; font-size: 25px; line-height: 1.15; letter-spacing: -.03em; font-weight: 600; text-wrap: balance; }
.kp-tarjeta p { margin: 0 0 12px; color: var(--kp-tinta-2); }
.kp-tarjeta p b, .kp-tarjeta p strong { color: var(--kp-tinta); font-weight: 600; }
.kp-tarjeta code { font: 500 12.5px Geist, system-ui, sans-serif; background: var(--kp-niebla); padding: 2px 7px; border-radius: 6px; color: var(--kp-tinta); }

.kp-permisos { list-style: none; margin: 18px 0 18px; padding: 0; display: grid; gap: 2px; }
.kp-permisos li { display: grid; grid-template-columns: 34px 1fr; gap: 12px; align-items: start; padding: 10px 0; border-top: 1px solid var(--kp-linea); }
.kp-permisos li:first-child { border-top: 0; }
.kp-permisos .kp-pi { width: 34px; height: 34px; border-radius: 10px; display: grid; place-items: center; background: var(--kp-niebla); color: var(--kp-tinta); }
.kp-permisos .kp-pi svg { width: 17px; height: 17px; }
.kp-permisos .kp-pi--no { background: rgba(122,63,201,.09); color: var(--kp-morado-tinta); }
.kp-permisos b { display: block; font-size: 14px; font-weight: 600; color: var(--kp-tinta); line-height: 1.3; }
.kp-permisos span { display: block; font-size: 13.5px; color: var(--kp-tinta-3); line-height: 1.45; }
.kp-nota { font-size: 13px; color: var(--kp-tinta-3); padding: 12px 14px; border-radius: 14px; background: var(--kp-niebla); margin: 0 0 4px; }

/* — formulario — */
.kp-campo { display: grid; gap: 6px; margin: 0 0 14px; }
.kp-campo label { font-size: 12.5px; font-weight: 500; color: var(--kp-tinta-2); }
.kp-campo input { width: 100%; font: inherit; font-size: 15px; padding: 12px 14px; border-radius: 12px; color: var(--kp-tinta);
  border: 1px solid rgba(8,8,8,.14); background: #fff; transition: border-color 160ms var(--kp-ease), box-shadow 160ms var(--kp-ease); }
.kp-campo input:focus { outline: none; border-color: var(--kp-morado); box-shadow: 0 0 0 4px rgba(122,63,201,.15); }
.kp-clave { position: relative; }
.kp-clave input { padding-right: 48px; }
.kp-ver { position: absolute; top: 50%; right: 6px; transform: translateY(-50%); display: grid; place-items: center; width: 36px; height: 36px;
  padding: 0; border: 0; border-radius: 10px; background: transparent; color: var(--kp-tinta-3); cursor: pointer;
  transition: color 160ms var(--kp-ease), background 160ms var(--kp-ease); }
.kp-ver:hover { color: var(--kp-tinta); background: var(--kp-niebla); }
.kp-ver:focus-visible { outline: 2px solid var(--kp-morado); outline-offset: 1px; }
.kp-ver svg { width: 18px; height: 18px; }
.kp-ver .kp-ver-no, .kp-ver[aria-pressed="true"] .kp-ver-si { display: none; }
.kp-ver[aria-pressed="true"] .kp-ver-no { display: block; }
.kp-error { margin: 4px 0 14px; padding: 10px 12px; border-radius: 12px; font-size: 13px; background: #FEF2F2; color: var(--kp-mal); border: 1px solid rgba(185,28,28,.15);
  animation: kp-no 480ms ease-out 200ms both; }

/* — botones: píldoras, la negra es la acción — */
.kp-acciones { display: flex; gap: 10px; margin-top: 22px; }
.kp-acciones > * { flex: 1; }
.kp-btn { display: inline-flex; align-items: center; justify-content: center; gap: 8px; min-height: 48px; padding: 0 20px;
  border-radius: 999px; font-family: inherit; font-size: 15px; font-weight: 600; line-height: 1; text-decoration: none; cursor: pointer;
  border: 1px solid rgba(8,8,8,.14); background: #fff; color: var(--kp-tinta);
  transition: transform 400ms var(--kp-resorte), background 160ms var(--kp-ease), box-shadow 240ms var(--kp-ease); }
.kp-btn svg { width: 17px; height: 17px; transition: transform 240ms var(--kp-ease); }
.kp-btn:hover { background: var(--kp-niebla); }
.kp-btn--si { background: var(--kp-negro); border-color: var(--kp-negro); color: #fff; }
.kp-btn--si:hover { background: #1c1c20; box-shadow: 0 10px 24px -10px rgba(54,17,95,.9); }
.kp-btn--si:hover svg { transform: translateX(3px); }
.kp-btn:active { transform: scale(.97); transition-duration: 100ms; }
.kp-btn:focus-visible { outline: 2px solid var(--kp-morado); outline-offset: 3px; }
.kp-cuenta { margin-top: 14px; font-size: 12.5px; color: var(--kp-tinta-3); text-align: center; }

.kp-pie { position: relative; z-index: 1; padding: 0 16px 22px; display: flex; align-items: center; gap: 7px;
  font: 500 11px/1 Geist, system-ui, sans-serif; letter-spacing: .04em; color: rgba(255,255,255,.42); }
.kp-pie svg { width: 12px; height: 12px; }

/* LA LUZ (2026-10-19, solo en el login): un resplandor morado oscuro que sigue
   al mouse con retraso y deja un rastro suave (public/assets/kp-luz.js). Es la
   única excepción a «sin degradados», pedida para esta pantalla. El lienzo va a
   media resolución y aquí se agranda y se difumina. */
.kp--luz .kp-fondo { background: var(--kp-negro); }
.kp--luz .kp-fondo .kp-luz { position: absolute; inset: 0; width: 100%; height: 100%; filter: blur(28px); }
/* Grano finísimo encima de la luz: deshace los «escalones» de color que se ven
   en un degradado tan oscuro. Con «overlay» sobre el negro no se nota; solo
   mezcla los tonos del morado. */
.kp--luz .kp-fondo .kp-grano { position: absolute; inset: 0; background-repeat: repeat; mix-blend-mode: overlay; opacity: 1; }

/* El cursor de Kaiva, el mismo del panel. */
.kp { --kp-cursor: url(assets/cursor-kaiva.svg) 6 5; cursor: var(--kp-cursor), auto; }
.kp a, .kp button, .kp label { cursor: var(--kp-cursor), pointer; }
.kp input:not([type="checkbox"]):not([type="radio"]) { cursor: text; }

@media (max-width: 480px) {
  .kp-tarjeta { padding: 26px 20px 22px; border-radius: 22px; }
  .kp-tarjeta h1 { font-size: 22px; }
  .kp-acciones { flex-direction: column-reverse; }
}
/* Movimiento reducido: sin desplazamientos, escalas, rebotes ni el flujo en
   bucle; el estado final se ve tal cual (el chulo, el error) desde el inicio. */
@media (prefers-reduced-motion: reduce) {
  .kp *, .kp *::before, .kp *::after { animation: none !important; transition: none !important; }
  .kp-enlace--ok .kp-insignia svg { stroke-dashoffset: 0; }
}
</style>
</head>
<body class="kp kp--luz">
<div class="kp-fondo" aria-hidden="true"></div>
<header class="kp-top"><a class="kp-marca" href="https://kaivastudio.com" aria-label="Kaiva Studio"><b>Kaiva</b>Studio<i>.</i></a></header>
<div class="kp-centro">
  <main class="kp-tarjeta">
    
    <p class="kp-ante">Kaiva OS</p>
    <h1>Hola de nuevo</h1>
    
  <p>El centro de mando del estudio. Vista previa con datos de ejemplo: entra sin usuario ni clave.</p>
  <form method="get" action="inicio.html" id="kp-login" style="margin-top:20px">
    <div class="kp-campo"><label for="u">Usuario</label><input id="u" autocomplete="username"></div>
    <div class="kp-campo"><label for="c">Clave</label><div class="kp-clave"><input id="c" type="password" autocomplete="current-password"><button type="button" class="kp-ver" aria-label="Mostrar clave" aria-pressed="false" aria-controls="c"><span class="kp-ver-si"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M2 12s3.6-7 10-7 10 7 10 7-3.6 7-10 7S2 12 2 12Z"/><circle cx="12" cy="12" r="3"/></svg></span><span class="kp-ver-no"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M2 12s3.6-7 10-7c2 0 3.7.7 5.1 1.6M22 12s-3.6 7-10 7c-2 0-3.7-.7-5.1-1.6"/><path d="M9.9 14.1a3 3 0 0 1 4.2-4.2"/><path d="M3 21 21 3"/></svg></span></button></div></div>
    
  </form>
    <div class="kp-acciones"><button form="kp-login" type="submit" class="kp-btn kp-btn--si">Entrar <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12h14"/><path d="m13 6 6 6-6 6"/></svg></button></div>
    
  </main>
</div>
<footer class="kp-pie"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="4" y="11" width="16" height="10" rx="2.5"/><path d="M8 11V7a4 4 0 0 1 8 0v4"/></svg>Kaiva OS · acceso del equipo</footer><script>document.addEventListener("submit",function(e){var b=e.submitter;if(b&&b.value==="cancelar")return;var l=document.querySelector(".kp-enlace");if(l)l.classList.add("kp-enlace--conectando");if(b)b.setAttribute("aria-busy","true");});document.addEventListener("click",function(e){var b=e.target.closest(".kp-ver");if(!b)return;var i=b.parentNode.querySelector("input"),ver=i.type==="password";i.type=ver?"text":"password";b.setAttribute("aria-pressed",ver);b.setAttribute("aria-label",ver?"Ocultar clave":"Mostrar clave");i.focus();});</script><script src="assets/kp-luz.js" defer></script>
</body>
</html>
